name: Deploy web + Firestore

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'functions/src/stories/render/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: techdaily-deploy
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: techdaily-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9 # Dart 3.13.7, matches pubspec sdk ^3.13.0
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build web --release
      # Content-hashed font names so phones never pair new code with a stale cached icon font.
      - run: python3 tool/web/fingerprint_fonts.py build/web

      # Share the pristine build with the hourly news workflow (it renders into a copy).
      - uses: actions/cache/save@v4
        continue-on-error: true # key may already exist
        with:
          path: build/web
          key: flutter-web-${{ hashFiles('lib/**', 'web/**', 'assets/**', 'pubspec.yaml', 'pubspec.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1015898924676/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'github-deployer@techdaily-prod.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Restore story cache
        uses: actions/cache/restore@v4
        with:
          path: functions/.cache/stories.json
          key: stories-cache-deploy-${{ github.run_id }}
          restore-keys: stories-cache-

      - name: Render static pages into build/web
        working-directory: functions
        run: npx tsx src/jobs.ts render --cache=.cache/stories.json --out=../build/web

      - name: Deploy hosting + Firestore rules/indexes
        # firebase-tools picks up GOOGLE_APPLICATION_CREDENTIALS exported by the auth step.
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore --project techdaily-prod --non-interactive
