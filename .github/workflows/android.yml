name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: techdaily-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Release signing (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
            echo "Using release keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret; APK is debug-signed"
          fi
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk TechDaily.apk && ls -lh TechDaily.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TechDaily-apk
          path: TechDaily.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest TechDaily.apk \
            --title "TechDaily for Android (build ${{ github.run_number }})" \
            --notes "Download TechDaily.apk on your Android phone, open it, and allow 'Install unknown apps' when asked." \
            --latest
