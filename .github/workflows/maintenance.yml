name: Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        options:
          - migrate-articles
          - purge-seed
        default: migrate-articles
      dry_run:
        description: 'Dry run (only count; no writes)'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: techdaily-ingest # never overlap with ingestion writes
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1015898924676/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'github-deployer@techdaily-prod.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      # migrate-articles: v1 `articles` -> v2 `stories` (fallback cards; the hourly run re-enriches
      # recent ones with Gemini). `articles` is only read. Safe to re-run.
      - name: Run ${{ inputs.task }}
        env:
          FIREBASE_PROJECT_ID: techdaily-prod
        run: npx tsx src/jobs.ts ${{ inputs.task }} ${{ inputs.dry_run && '--dry-run' || '' }}
